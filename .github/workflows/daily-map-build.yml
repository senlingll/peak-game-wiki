name: Build and deploy daily PEAK map page

on:
  schedule:
    # PEAK's observed reset is 18:00 +01:00 (17:00 UTC); fetch once after it settles.
    - cron: '10 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TODAY_MAP_FETCH_TIMEOUT_MS: 20000
      SITE_TIMEZONE: Asia/Shanghai
      PUBLISHED_ARTICLES: peak-biomes-list,peak-game-update
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Freeze site date in the configured timezone
        run: echo "BUILD_DATE=$(TZ="$SITE_TIMEZONE" date +%F)" >> "$GITHUB_ENV"

      - name: Fetch today's verified map
        run: npm run fetch:today-map

      - name: Fetch official PEAK update entries
        run: npm run fetch:updates
        continue-on-error: true

      - name: Commit daily map and update data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today-map.json data/peak-map-history.json data/peak-updates.json
          if git diff --cached --quiet; then
            echo "No daily map or update data changes to commit."
          else
            git commit -m "Update daily map and news data"
            git push origin HEAD:main
          fi

      - name: Build static pages
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name peak-game-wiki --branch main

      - name: Ping IndexNow
        run: npm run ping:indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_REQUIRE_SECRET: '1'
